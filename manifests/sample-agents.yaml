    expected: States the customer's available balance.
  - input: I want to transfer money
    expected: Offers to transfer between linked accounts and asks for amount/destination.
  - input: My card was stolen
    expected: Explains how to freeze the card instantly in the app.

---
apiVersion: aieval/v1
